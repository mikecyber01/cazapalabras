<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cazapalabras - ¡Aprende jugando!</title>
    <!-- Google Fonts para un aspecto divertido y infantil -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5252;
            --secondary: #FFEB3B;
            --accent: #4CAF50;
            --info: #2196F3;
            --purple: #9C27B0;
            --dark: #2C3E50;
            --light: #F8F9FA;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor general de pantallas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        /* Pantalla de inicio */
        .title-banner {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(3rem, 8vw, 5rem);
            color: #FFF;
            text-shadow: 4px 4px 0px var(--dark), -2px -2px 0px var(--primary);
            margin-bottom: 10px;
            text-align: center;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--dark);
            font-weight: 700;
            background: #FFF;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 30px;
            text-align: center;
        }

        /* Selección de Idiomas (Banderas) */
        .lang-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lang-btn {
            background: white;
            border: 4px solid white;
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Fredoka One', cursive;
        }

        .lang-btn:active, .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2);
        }

        .lang-btn.selected {
            border-color: var(--primary);
            background: #fff3f3;
            transform: scale(1.05);
        }

        /* Niveles */
        .levels-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            background: white;
            border: none;
            border-radius: 25px;
            padding: 15px;
            font-size: 1.4rem;
            font-family: 'Fredoka One', cursive;
            color: var(--dark);
            cursor: pointer;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            transition: transform 0.1s, background 0.2s;
            text-align: center;
        }

        .btn-nivel-1 { background-color: #FF6B6B; color: white; }
        .btn-nivel-2 { background-color: #4ECDC4; color: white; }
        .btn-nivel-3 { background-color: #FFE66D; color: var(--dark); }

        .btn:hover {
            filter: brightness(1.1);
        }

        /* --- PANTALLA DE JUEGO --- */
        #game-screen {
            background: radial-gradient(circle, #fbc531, #e1b12c);
            justify-content: flex-start;
            padding: 10px;
        }

        .game-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .stats {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: var(--dark);
        }

        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            box-shadow: 0 4px 0px #c0392b;
        }

        /* Estilo Sticker del Dibujo */
        .sticker-card {
            background: white;
            padding: 12px 25px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            border: 4px solid #FFF;
            transform: rotate(-2deg);
            animation: floatSticker 3s ease-in-out infinite;
        }

        @keyframes floatSticker {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50% { transform: rotate(2deg) translateY(-5px); }
        }

        .sticker-img {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 5px;
        }

        .speaker-btn {
            background: var(--info);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            margin-top: 5px;
            box-shadow: 0 3px 0px #1976D2;
        }

        /* Espacios para formar la palabra */
        .word-slots {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .slot {
            width: 45px;
            height: 55px;
            background: white;
            border: 3px dashed var(--dark);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--dark);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .slot.filled {
            background: #d4edda;
            border: 3px solid var(--accent);
            color: #155724;
            border-style: solid;
            transform: scale(1.1);
        }

        /* Área de juego donde caen las letras */
        .play-area {
            position: relative;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        /* Burbujas de letras cayendo */
        .falling-letter {
            position: absolute;
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--dark);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            border: 3px solid #fff;
            transition: transform 0.1s;
        }

        .falling-letter:hover {
            transform: scale(1.15);
        }

        /* Teclado auxiliar rápido en pantalla inferior */
        .keyboard-helper {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            padding-bottom: 10px;
        }

        .key-btn {
            background: white;
            border: none;
            border-radius: 10px;
            width: 38px;
            height: 42px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: var(--dark);
            cursor: pointer;
            box-shadow: 0 4px 0px #bdc3c7;
            transition: all 0.05s;
        }

        .key-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #bdc3c7;
        }

        /* Fuegos artificiales y celebración */
        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(30); opacity: 0; }
        }

        .celebration-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .celebration-box {
            background: white;
            padding: 30px 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .celebration-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }
    </style>
</head>

        // Cambiar idioma seleccionado
        function setLanguage(lang, btnElement) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
        }

        // Sintetizador de voz
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                let langCode = 'es-ES';
                if (currentLang === 'en') langCode = 'en-US';
                if (currentLang === 'va' || currentLang === 'ca') langCode = 'ca-ES';
                utterance.lang = langCode;
                utterance.rate = 0.8; // Más lento para niños
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentWord() {
            if (currentWordData) {
                speakWord(currentWordData.w);
            }
        }

        // Efectos de Sonido con AudioContext (sin archivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now); // A4
            osc.frequency.setValueAtTime(554.37, now + 0.1); // C#5
            osc.frequency.setValueAtTime(659.25, now + 0.2); // E5
            osc.frequency.setValueAtTime(880, now + 0.3); // A5

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

            osc.start(now);
            osc.stop(now + 0.6);
        }

        function playErrorSound() {
            // Sonido tipo claxon o error grave
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(110, now + 0.15);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.start(now);
            osc.stop(now + 0.35);
        }

        // Iniciar Juego
        function startGame(level) {
            currentLevel = level;
            currentWordIndex = 0;
            
            // Seleccionar 10 palabras aleatorias de la inmensa lista de ese nivel e idioma
            let levelPool = [...DATABASE[currentLang][level]];
            // Barajar aleatoriamente
            levelPool.sort(() => Math.random() - 0.5);
            // Tomar 10 para la partida actual
            activeWords = levelPool.slice(0, 10);

            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            const levelNames = {1: "Nivel 1 (Cortas)", 2: "Nivel 2 (Medias)", 3: "Nivel 3 (Largas)"};
            document.getElementById('level-display').innerText = levelNames[level];

            loadNextWord();
            startLoop();
        }

        function goToHome() {
            stopGame();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }

        function stopGame() {
            isGameActive = false;
            clearInterval(gameInterval);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            document.getElementById('play-area').innerHTML = '';
        }

        // Cargar palabra siguiente
        function loadNextWord() {
            if (currentWordIndex >= activeWords.length) {
                showFullCelebration();
                return;
            }

            currentWordData = activeWords[currentWordIndex];
            currentSlotIndex = 0;
            activeLetters = [];

            document.getElementById('word-counter').innerText = `Palabra: ${currentWordIndex + 1} / 10`;
            document.getElementById('item-emoji').innerText = currentWordData.e;

            // Crear huecos visuales
            const slotsContainer = document.getElementById('word-slots');
            slotsContainer.innerHTML = '';
            for (let i = 0; i < currentWordData.w.length; i++) {
                let slot = document.createElement('div');
                slot.className = 'slot';
                slot.id = `slot-${i}`;
                slotsContainer.appendChild(slot);
            }

            // Crear teclado auxiliar inferior rápido
            buildKeyboardHelper();

            // Pronunciar palabra
            setTimeout(() => speakCurrentWord(), 400);
        }

        // Crear teclado en pantalla para apoyo táctil
        function buildKeyboardHelper() {
            const kb = document.getElementById('keyboard-helper');
            kb.innerHTML = '';
            // Letras aleatorias o abecedario completo simplificado
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÀÈÉÍÒÓÚÇ';
            for (let char of alphabet) {
                let btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.innerText = char;
                btn.onclick = () => handleLetterSelection(char);
                kb.appendChild(btn);
            }
        }

        // Lógica de bucle de letras cayendo
        function startLoop() {
            isGameActive = true;
            let playArea = document.getElementById('play-area');
            
            // Intervalo para generar nuevas letras flotando
            gameInterval = setInterval(() => {
                if (!isGameActive) return;
                spawnFallingLetter();
            }, 1200);

            // Bucle de animación por fotograma
            function animate() {
                if (!isGameActive) return;
                
                let letters = playArea.getElementsByClassName('falling-letter');
                let areaHeight = playArea.clientHeight;

                for (let i = letters.length - 1; i >= 0; i--) {
                    let el = letters[i];
                    let y = parseFloat(el.dataset.y) + parseFloat(el.dataset.speed);
                    
                    if (y > areaHeight - 60) {
                        el.remove(); // Si llega abajo del todo desaparece
                    } else {
                        el.dataset.y = y;
                        el.style.top = y + 'px';
                    }
                }

                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        // Generar burbuja de letra aleatoria
        function spawnFallingLetter() {
            let playArea = document.getElementById('play-area');
            if (!playArea) return;

            let targetWord = currentWordData.w;
            let expectedChar = targetWord[currentSlotIndex];

            // 40% de probabilidad de que sea la letra correcta que necesita, 60% letra trampa
            let charToSpawn = '';
            if (Math.random() < 0.4 && expectedChar) {
                charToSpawn = expectedChar;
            } else {
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                charToSpawn = alphabet[Math.floor(Math.random() * alphabet.length)];
            }

            let el = document.createElement('div');
            el.className = 'falling-letter';
            el.innerText = charToSpawn;

            let maxX = playArea.clientWidth - 60;
            let startX = Math.max(10, Math.random() * maxX);
            
            el.style.left = startX + 'px';
            el.style.top = '-60px';
            el.dataset.y = -60;
            // Velocidad adaptada suave
            el.dataset.speed = 1.2 + (currentLevel * 0.4) + (Math.random() * 0.8);

            // Evento al tocar la letra flotante
            el.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                handleLetterSelection(charToSpawn, el);
            });

            playArea.appendChild(el);
        }

        // Validar si la letra seleccionada es correcta
        function handleLetterSelection(selectedChar, element = null) {
            if (!isGameActive || !currentWordData) return;

            let targetWord = currentWordData.w;
            let expectedChar = targetWord[currentSlotIndex];

            if (selectedChar === expectedChar) {
                // ¡ACIERTO!
                playSuccessSound();
                let slot = document.getElementById(`slot-${currentSlotIndex}`);
                if (slot) {
                    slot.innerText = selectedChar;
                    slot.classList.add('filled');
                }

                if (element) element.remove();

                currentSlotIndex++;

                // ¿Completó la palabra?
                if (currentSlotIndex >= targetWord.length) {
                    playSuccessSound();
                    showWordCelebration();
                }
            } else {
                // ¡FALLO! (Claxon o error)
                playErrorSound();
                if (element) {
                    element.style.borderColor = '#FF5252';
                    element.style.background = '#ffebee';
                    setTimeout(() => { if(element) element.remove(); }, 300);
                }
            }
        }

        // Celebración por palabra completada
        function showWordCelebration() {
            isGameActive = false;
            clearInterval(gameInterval);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            let playArea = document.getElementById('play-area');
            playArea.innerHTML = '';

            // Mostrar fuegos artificiales visuales
            createFireworksEffect();

            setTimeout(() => {
                currentWordIndex++;
                isGameActive = true;
                loadNextWord();
                startLoop();
            }, 2200);
        }

        // Celebración final al completar los 10 juegos
        function showFullCelebration() {
            stopGame();
            let gameScreen = document.getElementById('game-screen');
            
            let overlay = document.createElement('div');
            overlay.className = 'celebration-overlay';
            overlay.innerHTML = `
                <div class="celebration-box">
                    <div class="celebration-title">🎉 ¡ENHORABUENA! 🎉</div>
                    <p style="font-size: 1.3rem; margin-bottom: 20px;">¡Has completado todos los retos de este nivel como un campeón!</p>
                    <button class="btn btn-nivel-1" onclick="location.reload()">Jugar de Nuevo</button>
                </div>
            `;
            gameScreen.appendChild(overlay);
            createFireworksEffect();
        }

        // Efectos visuales de fuegos artificiales
        function createFireworksEffect() {
            let container = document.getElementById('game-screen');
            for (let i = 0; i < 25; i++) {
                let fw = document.createElement('div');
                fw.className = 'firework';
                fw.style.left = (Math.random() * 80 + 10) + '%';
                fw.style.top = (Math.random() * 60 + 20) + '%';
                let colors = ['#ff5252', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0'];
                fw.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(fw);
                setTimeout(() => fw.remove(), 1000);
            }
        }
    </script>
